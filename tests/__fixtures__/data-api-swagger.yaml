        '202':
          description: Credential rotated successfully
        '401':
          description: Unauthorized
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Credential not found"
        '400':
          description: Bad Request - Returned when the request parameters are invalid or malformed


servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
components:
  schemas:

    Error:
      type: object
      properties:
        id:
          type: string
          example: "rate_limit"
        message:
          type: string
          example: "Your account reached the API limit. Please wait a few minutes before making new requests"
        url:
          type: string
          example: "https://devcenter.heroku.com/articles/platform-api-reference#rate-limits"
      required:
        - id
        - message

    Setting:
      description: Individual database setting configuration
      type: object
      properties:
        name:
          type: string
          description: Name of the setting
        current:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          description: Current value of the setting
        default:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          description: Default value of the setting
        reboot_required:
          type: boolean
          description: Whether a reboot is required to apply changes
        description:
          type: string
          description: Description of the setting
        override:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
          description: The user-configured override value for the setting, or null if not overridden
      required:
        - name
        - current
        - default
        - reboot_required
        - description
        - override

    Settings:
      description: Collection of database settings
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
          description: Array of individual setting objects
      required:
        - items
      example:
        items:
          - name: log_connections
            current: true
            default: false
            reboot_required: false
            description: "Logs each successful connection."
            override: true
          - name: log_lock_waits
            current: true
            default: true
            reboot_required: false
            description: "Logs long lock waits."
            override: null
          - name: log_min_duration_statement
            current: 1000
            default: -1
            reboot_required: false
            description: "Sets the minimum execution time above which all statements will be logged."
            override: 250

    Level:
      description: Individual performance level configuration
      type: object
      properties:
        name:
          type: string
          description: "Performance level name containing '{size}G' where size is the memory allocation"
          example: "32G-Performance"
        vcpu:
          type: number
          description: "Number of virtual CPUs"
          example: 8
        memory_in_gb:
          type: number
          description: "Memory allocation in GB"
          example: 32
        connection_limit:
          type: number
          description: "Maximum number of connections allowed per instance"
          example: 5000
      required:
        - name
        - vcpu
        - memory_in_gb
        - connection_limit

