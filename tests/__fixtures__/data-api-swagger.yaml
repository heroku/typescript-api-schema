    Transfer:
      description: |
        A data transfer (database backup, copy, or restore).
        Datetime fields are returned as space-separated UTC strings like
        "2024-05-28 11:19:37 +0000" (not RFC 3339).
      type: object
      required:
        - uuid
        - num
        - from_type
        - to_type
        - processed_bytes
        - warnings
        - created_at
        - num_keep
      properties:
        uuid:
          type: string
          description: Unique identifier of the transfer (UUID).
        num:
          type: integer
          description: Sequential transfer number within the app.
        from_name:
          type: string
          nullable: true
        from_type:
          type: string
          enum:
            - pg_dump
            - pg_restore
            - gof3r
            - htcat
        from_url:
          type: string
          nullable: true
          description: |
            Source URL for the transfer. Credentials are stripped for
            pg_dump/pg_restore types; for gof3r/htcat the URL is returned
            as stored.
        to_name:
          type: string
          nullable: true
        to_type:
          type: string
          enum:
            - pg_dump
            - pg_restore
            - gof3r
            - htcat
        to_url:
          type: string
          nullable: true
          description: |
            Destination URL for the transfer. Credentials are stripped for
            pg_dump/pg_restore types; for gof3r/htcat the URL is returned
            as stored.
        options:
          type: object
          description: Freeform options passed through to transfer workers.
        source_bytes:
          type: integer
          format: int64
          nullable: true
        processed_bytes:
          type: integer
          format: int64
          nullable: true
        succeeded:
          type: boolean
          nullable: true
          description: null while in-progress; true on success; false on failure.
        warnings:
          type: integer
        created_at:
          type: string
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
          example: "2024-05-28 11:19:37 +0000"
        started_at:
          type: string
          nullable: true
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
          example: "2024-05-28 11:19:39 +0000"
        canceled_at:
          type: string
          nullable: true
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
        updated_at:
          type: string
          nullable: true
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
        finished_at:
          type: string
          nullable: true
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
        deleted_at:
          type: string
          nullable: true
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
        purged_at:
          type: string
          nullable: true
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
        num_keep:
          type: integer
          description: Retention count.
        schedule:
          type: object
          nullable: true
          description: Present only for scheduled transfers.
          properties:
            uuid:
              type: string
              description: UUID of the schedule.
        logs:
          type: array
          description: Present when the request includes ?verbose=true.
          items:
            "$ref": "#/components/schemas/TransferLog"

    TransferLog:
      description: A single transfer log entry.
      type: object
      required:
        - created_at
        - level
        - message
      properties:
        created_at:
          type: string
          description: Space-separated UTC timestamp like "2024-05-28 11:19:37 +0000".
          example: "2026-06-08 17:57:37 +0000"
        level:
          type: string
          enum:
            - info
            - warning
            - error
        message:
          type: string

    TransferCreateRequest:
      description: Request body for creating a transfer.
      type: object
      required:
        - from_type
        - from_url
        - to_type
        - to_url
      properties:
        from_type:
          type: string
          enum:
            - pg_dump
            - pg_restore
            - gof3r
            - htcat
        from_url:
          type: string
          description: Source URL for the transfer.
        from_name:
          type: string
          nullable: true
        to_type:
          type: string
          enum:
            - pg_dump
            - pg_restore
            - gof3r
            - htcat
        to_url:
          type: string
          description: |
            Destination URL. Use "auto" when to_type=gof3r to have the
            server generate a destination.
        to_name:
          type: string
          nullable: true
        options:
          type: object
          description: Freeform options passed through to transfer workers.
        num_keep:
          type: integer
          description: Override for retention count.
        log_input_url:
          type: string
          description: Optional logplex drain URL for transfer worker logs.

    TransferPublicUrlRequest:
      description: Optional request body for the public-url action.
