          description: Unauthorized
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Credential not found"
    delete:
      tags:
        - PG2.0
      summary: Delete database credential
      description: Deletes a specific credential for a PostgreSQL database
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: cred_name
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Credential deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Credential not found"
  /data/postgres/v1/{addon_id}/credentials/{cred_name}/rotate:
    post:
      tags:
        - PG2.0
      summary: Rotate database credential
      description: Rotates a specific credential for a PostgreSQL database. This operation will invalidate the current password and generate a new one.
      parameters:
        - name: addon_id
          description: ID of database addon
