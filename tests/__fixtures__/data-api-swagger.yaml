          description: Optional name to register the link under.

    Link:
      description: A dataset link between two Postgres databases.
      type: object
      required:
        - id
        - created_at
        - name
        - remote_name
        - remote
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        name:
          type: string
        remote_name:
          type: string
        remote:
          type: object
          required:
            - name
            - attachment_name
          properties:
            name:
              type: string
            attachment_name:
              type: string

    LinkCreateResult:
      "$ref": "#/components/schemas/Link"

    LinkInfoResult:
      "$ref": "#/components/schemas/Link"

    LinkDeleteResult:
      "$ref": "#/components/schemas/Link"

    ConnectionPoolingInfoResult:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: ["enabled", "disabled"]
          description: Whether connection pooling is enabled for the database.
        message:
          type: string
          description: Human-readable description of the pooling status.

    ConnectionPoolingCreateOpts:
      type: object
      properties:
        name:
          type: string
          description: Optional name for the connection pooling attachment.
        credential:
          type: string
          description: Database credential to associate with the pool. Defaults to "default".
        app:
          type: string
          description: Heroku app to attach the pool to. Defaults to the addon's owning app.

    ConnectionPoolingCreateResult:
      type: object
      properties:
        name:
          type: string
          description: Name assigned to the new connection pooling attachment.

    BurstStatusInfoResult:
      description: Recent burst-balance observation for a database, used to assess IO headroom.
      type: object
      required:
        - addon_name
        - addon_id
        - at
        - burst_status
      properties:
        addon_name:
          type: string
        addon_id:
          type: string
        at:
          type: string
          format: date-time
          description: Timestamp of the observation.
        burst_status:
          type: object
          required:
            - volumebalance
          properties:
            volumebalance:
              type: object
              required:
                - latest_value
                - slope
              properties:
                latest_value:
                  type: number
                slope:
                  type: number

    MetricsInfoResult:
      description: Database metrics payload. Schema is intentionally open.
      type: object
      additionalProperties: true
    PostgresConfigEnumSetting:
      description: Configuration setting whose value is one of a fixed set of strings.
      type: object
      required:
        - value
        - desc
        - default
        - values
      properties:
        value:
          type: string
        desc:
          type: string
        default:
          type: string
        values:
          type: object
          description: Map of allowed value to human-readable description.
          additionalProperties:
            type: string

    PostgresConfigBooleanSetting:
      type: object
      required:
        - value
        - desc
        - default
      properties:
        value:
          type: boolean
        desc:
          type: string
        default:
          type: boolean

    PostgresConfigIntegerSetting:
      type: object
      required:
        - value
        - desc
        - default
      properties:
        value:
          type: integer
        desc:
          type: string
        default:
          type: integer

    PostgresDatabaseConfigResult:
      description: |
        Current values for tunable Postgres / pgbouncer configuration knobs.
        All fields are optional; only knobs supported by the database tier are returned.
      type: object
      properties:
        log_lock_waits:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        log_connections:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        log_min_duration_statement:
          "$ref": "#/components/schemas/PostgresConfigIntegerSetting"
        log_statement:
          "$ref": "#/components/schemas/PostgresConfigEnumSetting"
        track_functions:
          "$ref": "#/components/schemas/PostgresConfigEnumSetting"
        log_min_error_statement:
          "$ref": "#/components/schemas/PostgresConfigEnumSetting"
        pgbouncer_max_client_conn:
          "$ref": "#/components/schemas/PostgresConfigIntegerSetting"
        pgbouncer_max_db_connections:
          "$ref": "#/components/schemas/PostgresConfigIntegerSetting"
        pgbouncer_default_pool_size:
          "$ref": "#/components/schemas/PostgresConfigIntegerSetting"
        pgbouncer_server_idle_timeout:
          "$ref": "#/components/schemas/PostgresConfigIntegerSetting"
        pgbouncer_min_pool_size:
          "$ref": "#/components/schemas/PostgresConfigIntegerSetting"
        data_connector_details_logs:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        auto_explain:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        auto_explain.log_format:
          "$ref": "#/components/schemas/PostgresConfigEnumSetting"
        auto_explain.log_min_duration:
          "$ref": "#/components/schemas/PostgresConfigIntegerSetting"
        auto_explain.log_analyze:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        auto_explain.log_triggers:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        auto_explain.log_buffers:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        auto_explain.log_verbose:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"
        auto_explain.log_nested_statements:
          "$ref": "#/components/schemas/PostgresConfigBooleanSetting"

    PostgresDatabaseUpdateConfigOpts:
      description: |
        Subset of configuration knobs to update. Only the fields provided are changed.
      type: object
      properties:
        track_functions:
          type: string
        log_min_duration_statement:
          type: integer
        log_connections:
          type: boolean

    PostgresDatabaseUpdateConfigResult:
      "$ref": "#/components/schemas/PostgresDatabaseConfigResult"

    PostgresDatabaseListCredentialsResult:
      description: List of credential stores for a Heroku PostgreSQL database. Schema is intentionally open.
      type: object
      additionalProperties: true

    PostgresDatabaseCreateCredentialsOpts:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the credential to create.

    PostgresDatabaseCreateCredentialsResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    PostgresDatabaseRotateCredentialsResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    PostgresDatabaseDeleteCredentialResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    PostgresDatabaseInfoCredentialResult:
      description: Details for a specific credential store.
      type: object
      required:
        - uuid
        - name
        - state
        - database
        - host
        - port
        - credentials
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        database:
          type: string
        host:
          type: string
        port:
          type: integer
        credentials:
          type: array
          items:
            type: object
            required:
              - user
              - password
              - state
            properties:
              user:
                type: string
              password:
                type: string
              state:
                type: string

    PostgresDatabaseRotateCredentialResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    PostgresDatabaseRepairDefaultResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    ValkeyInfoResult:
      description: |
        Information about a Heroku Key-Value Store database.
      type: object
      properties:
        addon_id:
          type: string
        name:
          type: string
        plan:
          type: string
        created_at:
          type: string
          format: date-time
        formation:
          type: object
          properties:
            id:
              type: string
            primary:
              type: string
              nullable: true
              description: UUID of the primary service, or null before one is assigned.
        metaas_source:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        resource_url:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
          description: Observed Valkey version, falling back to the configured version.
          example: "7.2.8"
        prefer_native_tls:
          type: boolean
          nullable: true
          description: Whether clients should connect using native TLS.
        customer_encryption_key:
          type: string
          description: ARN of the customer-managed encryption key, present only when BYOK is configured.
        info:
          type: array
          description: Human-readable name/value rows shown by the CLI (e.g. Plan, Status, Version, Maxmemory).
          items:
            type: object
            required:
              - name
              - values
            properties:
              name:
                type: string
              values:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: number

    ValkeyConfigSetting:
      description: |
        A single configurable Valkey setting with its current value, description, default,
        and—for enumerated settings—the allowed values.
      type: object
      required:
        - value
        - desc
        - default
      properties:
        value:
          oneOf:
            - type: string
            - type: integer
            - type: boolean
        desc:
          type: string
        default:
          oneOf:
            - type: string
            - type: integer
            - type: boolean
        values:
          type: object
          description: For enumerated settings, a map of allowed value to its description.
          additionalProperties:
            type: string

    ValkeyConfigResult:
      description: |
        Map of configurable Valkey settings keyed by setting name. The set of keys is
        determined by the database and may change over time; known customer-facing
        settings include timeout, maxmemory_policy, and notify_keyspace_events.
      type: object
      additionalProperties:
        "$ref": "#/components/schemas/ValkeyConfigSetting"
      example:
        timeout:
          value: 300
          desc: "Represent how long a client can idle before being disconnected."
          default: 300
        maxmemory_policy:
          value: "noeviction"
          desc: "Sets the desired key eviction behavior when a Valkey instance reaches max memory."
          default: "noeviction"
          values:
            noeviction: "return errors when memory limit is reached"
            allkeys-lru: "evict keys trying to remove the less recently used keys first"
            volatile-lru: "evict keys trying to remove the less recently used keys first, but only those that have an expiry set"
            allkeys-random: "evict random keys"
            volatile-random: "evict random keys in order to make space for the new data added, but only evict keys with an expire set"
            volatile-ttl: "evict only keys with an expire set, and try to evict keys with a shorter time to live (TTL) first"
            allkeys-lfu: "evict any key using approximated LFU"
            volatile-lfu: "evict using approximated LFU among the keys with an expire set"
        notify_keyspace_events:
          value: ""
          desc: "Enables keyspace notifications."
          default: ""

    ValkeyUpdateConfigOpts:
      description: |
        Settings to update on the database. All fields are optional; only the supplied
        settings are changed.
      type: object
      properties:
        timeout:
          type: integer
          description: How long a client can idle (in seconds) before being disconnected.
          example: 300
        maxmemory_policy:
          type: string
          description: Key eviction behavior when the instance reaches max memory.
          enum:
            - noeviction
            - allkeys-lru
            - volatile-lru
            - allkeys-random
            - volatile-random
            - volatile-ttl
            - allkeys-lfu
            - volatile-lfu
          example: "volatile-lru"
        notify_keyspace_events:
          type: string
          description: Keyspace notification classes to enable (empty string disables them).
          example: ""

    ValkeyUpgradeOpts:
      description: |
        Options for a Valkey version upgrade.
      type: object
      required:
        - version
      properties:
        version:
          type: string
          description: Target Valkey major version to upgrade to.
          example: "7"

    ValkeyCredentialsRotationResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Credentials rotation successful"

    ValkeyStatsResetResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Stats reset successful."

    ValkeyUpgradeResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Your Valkey version is being upgraded to 7."

    ValkeyWaitStatusResult:
      description: |
        Status of any in-progress operation on the database.
      type: object
      required:
        - message
        - "waiting?"
      properties:
        message:
          type: string
          description: Human-readable status (e.g. available, preparing, upgrading version, maintenance_running).
          example: "available"
        "waiting?":
          type: boolean
          example: false
