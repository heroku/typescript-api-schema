            connection_limit: 1000
          - name: "16G-Performance"
            vcpu: 2
            memory_in_gb: 16
            connection_limit: 2000
          - name: "32G-Performance"
            vcpu: 4
            memory_in_gb: 32
            connection_limit: 5000
          - name: "64G-Performance"
            vcpu: 8
            memory_in_gb: 64
            connection_limit: 10000
          - name: "128G-Performance"
            vcpu: 16
            memory_in_gb: 128
            connection_limit: 20000
          - name: "256G-Performance"
            vcpu: 32
            memory_in_gb: 256
            connection_limit: 40000
          - name: "384G-Performance"
            vcpu: 48
            memory_in_gb: 384
            connection_limit: 60000
          - name: "512G-Performance"
            vcpu: 64
            memory_in_gb: 512
            connection_limit: 80000
          - name: "768G-Performance"
