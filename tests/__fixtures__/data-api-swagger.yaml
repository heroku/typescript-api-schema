    post:
      tags:
        - PG2.0
      summary: Create a logical replication publication
      description: |
        Creates a publication after logical replication publishing is enabled. Publication
        names must be lowercase PostgreSQL identifiers up to 63 bytes. Table targets must be
        fully-qualified, customer-owned persistent tables. Schema targets require Postgres 15+
