  /data/postgres/v1/{addon_id}/rotate_credentials:
    post:
      tags:
        - PG2.0
      summary: Rotate all database credentials
      description: Rotates all credentials for a PostgreSQL database. This operation will invalidate all current passwords and generate new ones for all credentials associated with the database.
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                forced:
                  type: boolean
                  description: Immediately kills all connections and performs rotations on all credentials.
      responses:
        '200':
          description: All credentials rotated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Confirmation message of the rotation
              example:
                message: "All credentials have been rotated within {database_name}."
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
        '400':
          description: Bad Request - Returned when the request parameters are invalid or malformed
