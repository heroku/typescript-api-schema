    Quotas:
      type: object
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/StorageQuota'

    TableLimit:
      description: The limit for the number of supported tables in a database.
      type: object
      required:
        - name
        - current
        - limit
      properties:
        name:
          type: string
          enum: ["table-limit"]
          description: "Name of plan limit"
        current:
          type: integer
          description: "Current number of tables"
        limit:
          type: integer
          description: "Limit threshold for number of tables"
      example:
        name: "table-limit"
        current: 100
        limit: 4000

    StorageLimit:
      description: The limit for the number of supported tables in a database.
      type: object
      required:
        - name
        - current
        - limit
      properties:
        name:
          type: string
          enum: ["storage-limit-in-gb"]
          description: "Name of plan limit"
        current:
          type: integer
          description: "Current storage limit"
        limit:
          type: integer
          description: "Limit on storage"
      example:
        name: "storage-limit-in-gb"
        current: 0
        limit: 128000

    StorageQuota:
      type: object
      required:
        - type
        - current_gb
        - warning_gb
        - critical_gb
        - enforcement_action
        - enforcement_active
      properties:
        type:
          type: string
          enum: ["storage"]
          description: "Type of quota"
        current_gb:
          type: number
          format: float
          nullable: true
          description: "Current storage usage in gigabytes"
        warning_gb:
          type: integer
          nullable: true
          description: "Warning threshold in gigabytes"
        critical_gb:
          type: integer
          nullable: true
          description: "Critical threshold in gigabytes"
        enforcement_action:
          $ref: '#/components/schemas/EnforcementAction'
        enforcement_active:
          type: boolean
          description: "Whether enforcement is currently active"
      example:
        type: "storage"
        current_gb: 100.000
        warning_gb: 50
        critical_gb: 100
        enforcement_action: "notify"
        enforcement_active: true

    StorageQuotaRequest:
      type: object
      properties:
        warning_gb:
          type: integer
          nullable: true
          description: Warning threshold for storage quota in gigabytes. Pass null to unset this value.
          example: 50
        critical_gb:
          type: integer
          nullable: true
          description: Critical threshold for storage quota in gigabytes. Pass null to unset this value.
          example: 100
        enforcement_action:
          type: string
          enum: ["restrict", "notify", "none"]
          description: |
            Action to take when quota is exceeded.

            * **restrict** - Revokes CREATE/INSERT privileges and limits connections to 1.
              Data can still be read and deleted to bring your database into compliance.
            * **notify** - Notify the customer that their database has exceeded its critical threshold and take no further action.
            * **none** - Do nothing and incur additional costs.
          example: "restrict"

    EnforcementAction:
      type: string
      enum: ["restrict", "notify", "none"]
      description: |
        Action taken when quota is exceeded.
        * **restrict** - Revokes CREATE/INSERT privileges and limits connections to 1.
          Data can still be read and deleted to bring your database into compliance.
        * **notify** - Notify the customer that their database has exceeded its critical threshold and take no further action.
        * **none** - Do nothing and incur additional costs.

    Attachment:
      type: object
      properties:
        name:
          type: string
        config:
          type: object
          properties:
            pool:
              type: string
            credential:
              type: string
            proxy:
              type: boolean

    AttachmentResponse:
      type: object
      properties:
        config:
          type: object
        name:
          type: string

    PreassessmentCheck:
      description: Individual preassessment check result
      type: object
      required:
        - name
        - result
      properties:
        name:
          type: string
          description: Name of the preassessment check
          example: "postgres-check-pk"
        result:
          type: string
          enum:
            [
              "passed",
              "failed",
              "warning",
              "error",
              "cancelled",
              "skipped",
              "pending",
              "running",
            ]
          description: Result of the preassessment check
        description:
          type: string
          nullable: true
          description: Description of the check result or failure details. Typically only populated for failed, warning, or error checks.
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: When the check was last executed
          example: "2025-01-30T15:00:00.000+00:00"
      example:
        name: "postgres-check-pk"
        result: "passed"
        description: null
        checked_at: "2025-01-30T15:00:00.000+00:00"

    PreassessmentResults:
      description: Collection of preassessment check results for database migration
      type: array
      items:
        $ref: "#/components/schemas/PreassessmentCheck"
      example:
        - name: "postgres-check-pk"
          result: "passed"
          description: null
          checked_at: "2025-01-30T15:00:00.000+00:00"
        - name: "postgres-check-pk-lob"
          result: "passed"
          description: null
          checked_at: "2025-01-30T15:00:05.000+00:00"
        - name: "postgres-check-wallevel"
          result: "passed"
          description: null
          checked_at: "2025-01-30T15:00:10.000+00:00"
        - name: "postgres-check-select-object-privileges"
          result: "failed"
          description: "pgbench_history table is missing required SELECT privileges"
          checked_at: "2025-01-30T15:00:15.000+00:00"

    MigrationResponse:
      description: Database migration status and details
      type: object
      required:
        - id
        - status
        - full_load_progress
        - cdc_lag
        - preassessment_results
        - auto_promote
        - completed
        - successful
        - source_id
        - target_id
        - status_description
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the migration
        status:
          type: string
          enum:
            [
              "creating_target",
              "preparing",
              "migrating",
              "completed",
              "failed",
              "cancelled",
              "ready",
              "promoting",
              "unknown",
            ]
          description: Current status of the migration
        full_load_progress:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Full-load migration progress as a percentage. Null if full-load hasn't started or when using CDC-only migration.
        cdc_lag:
          type: integer
          nullable: true
          description: CDC replication lag in seconds between source and target. Null if CDC is not active or hasn't started.
        preassessment_results:
          $ref: "#/components/schemas/PreassessmentResults"
        auto_promote:
          type: boolean
          description: Whether the target will be automatically promoted after migration completes
        completed:
          type: boolean
          description: Whether the migration has completed
        successful:
          type: boolean
          description: Whether the migration completed successfully
        source_id:
          type: string
          format: uuid
          description: Source addon identifier
        target_id:
          type: string
          format: uuid
          description: Target addon identifier
        last_error_message:
          type: string
          nullable: true
          description: The most recent error message if the migration failed or encountered issues
        stop_reason:
          type: string
          nullable: true
          description: The reason why the migration stopped, as returned by AWS DMS
        tables_errored:
          type: integer
          nullable: true
          description: Number of tables that encountered errors during migration
        status_description:
          type: string
          nullable: true
      example:
        id: "01234567-89ab-cdef-0123-456789abcdef"
        status: "migrating"
        full_load_progress: 85
        cdc_lag: 12
        last_error_message: null
        stop_reason: null
        tables_errored: 0
        preassessment_results:
          - name: "postgres-check-pk"
            result: "passed"
            description: null
            checked_at: "2025-01-30T15:00:00.000+00:00"
          - name: "postgres-check-pk-lob"
            result: "passed"
            description: null
            checked_at: "2025-01-30T15:00:05.000+00:00"
          - name: "postgres-check-wallevel"
            result: "passed"
            description: null
            checked_at: "2025-01-30T15:00:10.000+00:00"
          - name: "postgres-check-select-object-privileges"
            result: "failed"
            description: "pgbench_history table is missing required SELECT privileges"
            checked_at: "2025-01-30T15:00:15.000+00:00"
        auto_promote: false
        completed: false
        successful: false
        source_id: "abcdef01-2345-6789-abcd-ef0123456789"
        target_id: "01234567-89ab-cdef-0123-456789abcdef"
        status_description: "Migrating: 1/5 tables"

