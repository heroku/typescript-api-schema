---
openapi: 3.0.1
info:
  title: Heroku Data API V1
  version: v1
  description: |
    The Heroku Data API provides programmatic access to Heroku's data services, including PostgreSQL databases and other data addons.

    ### Authentication
    Non-public endpoints require a valid Authorization header with your Heroku API token.

    Example: `Authorization: Bearer your-heroku-api-token`

    ### Accept Header
    All requests must include the Accept header: `application/vnd.heroku+json; version=3`
tags:
  - name: PG2.0
    description: PG2.0 operations (pre GA, breaking changes are expected)
  - name: Maintenances
    description: Maintenance status and scheduling for data services
paths:
  # PostgreSQL Paths
  /data/postgres/v1/levels/{tier}:
    get:
      tags:
        - PG2.0
      summary: Retrieves available PostgreSQL levels
      security: []
      parameters:
      - name: tier
        in: path
        required: true
        schema:
          type: string
          enum: ["advanced"]
      responses:
          '200':
            description: List of available PostgreSQL levels
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Levels'
          '400':
            description: Bad Request

  /data/postgres/v1/{addon_id}/pools:
    post:
      tags:
        - PG2.0
      summary: Creates a new Instance Pool on a Next-Gen PostgreSQL addon.
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - level
                - count
              properties:
                name:
                  type: string
                  description: "Name of the pool. If not provided, a default name will be generated (e.g., 'loyal-pool-63063'). Must be 3-32 characters inclusive, begin with a letter, contain only ASCII letters/digits/hyphens, and not end with a hyphen or contain consecutive hyphens."
                  minLength: 3
                  maxLength: 32
                  pattern: "^[A-Za-z](?!.*--)[A-Za-z0-9-]*[A-Za-z0-9]$"
                  example: "analytics"
                level:
                  type: string
                  description: "Level name"
                  example: "32G-Performance"
                count:
                  type: integer
                  description: "Number of instances in the pool"
                  example: 1
      responses:
        '201':
          description: Instance pool created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ComputePool"
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
        '409':
          description: An instance pool with the same name already exists.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "conflict"
                message: "An instance pool with the same name already exists."
        '422':
          description: Unprocessable Entity - Returned when validators reject the pool (invalid name, unsupported level, count out of range, etc.)

  /data/postgres/v1/{addon_id}/pools/{pool_id}:
    get:
      tags:
        - PG2.0
      summary: Retrieves an Instance Pool on a Next-Gen PostgreSQL addon.
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
        - name: pool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance pool retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ComputePool"
        '404':
          description: Instance pool not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "An instance pool with this name does not exist."

    patch:
      tags:
        - PG2.0
      summary: Updates an Instance Pool on a Next-Gen PostgreSQL addon.
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
        - name: pool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Name of the pool"
                  example: "analytics"
                level:
                  type: string
                  description: "Level name"
                  example: "32G-Performance"
                count:
                  type: integer
                  description: "Number of instances in the pool"
                  example: 1
      responses:
        '200':
          description: Instance pool updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ComputePool"
        '404':
          description: Instance pool not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "An instance pool with this name does not exist."

    delete:
      tags:
        - PG2.0
      summary: Deletes an Instance Pool on a Next-Gen PostgreSQL addon.
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
        - name: pool_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Instance pool deleted successfully
        '404':
          description: Instance pool not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "An instance pool with this name does not exist."

  /data/postgres/v1/{addon_id}/settings:
    get:
      tags:
        - PG2.0
      summary: Retrieve PostgreSQL settings
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current PostgreSQL settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
    put:
      tags:
        - PG2.0
      summary: Update PostgreSQL settings
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: string
                  description: Comma-separated list of setting name-value pairs
                  example: "log_min_duration_statement:500,idle_in_transaction_session_timeout:864000"
              required:
                - settings
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: "Name of the setting that was changed"
                        previous:
                          oneOf:
                            - type: string
                            - type: number
                            - type: boolean
                          nullable: true
                          description: "Previous value of the setting"
                        current:
                          oneOf:
                            - type: string
                            - type: number
                            - type: boolean
                          nullable: true
                          description: "New value of the setting"
                      required:
                        - name
                        - previous
                        - current
                example:
                  changes:
                    - name: "log_min_duration_statement"
                      previous: "550"
                      current: "500"
                    - name: "idle_in_transaction_session_timeout"
                      previous: "80000"
                      current: "864000"
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
        '422':
          description: Unprocessable Entity - Returned when the CustomSettingsValidator rejects the requested settings (unknown setting name, value out of range, etc.)

  /data/postgres/v1/{addon_id}/info:
    get:
      tags:
        - PG2.0
      summary: Retrieves information about a Performance-Tier PostgreSQL database.
      description: |
        This endpoint is only available for Performance-Tier databases.

        When an active migration is in progress to this database, the status field will be set to "migrating".
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PostgreSQL info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresTenant'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"

  /data/postgres/v1/{addon_id}/quotas:
    get:
      tags:
        - PG2.0
      summary: Retrieve PostgreSQL quotas
      description: Retrieves a list of all quotas for a PostgreSQL database
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of database quotas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotas'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
  /data/postgres/v1/{addon_id}/quotas/{quota_type}:
    get:
      tags:
        - PG2.0
      summary: Retrieve a PostgreSQL quota by type
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: quota_type
          description: Type of quota to retrieve
          in: path
          required: true
          schema:
            type: string
            enum: ["storage"]
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quota information
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StorageQuota'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
    patch:
      tags:
        - PG2.0
      summary: Updates database quota by type
      description: Updates the quota settings for a PostgreSQL database. Only provided fields will be updated. Passing null for a value will unset that quota setting.
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: quota_type
          description: Type of quota to update
          in: path
          required: true
          schema:
            type: string
            enum: ["storage"]
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StorageQuotaRequest'
      responses:
        '200':
          description: Quota updated successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StorageQuota'
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
        '422':
          description: Unprocessable Entity - Returned when the StorageQuotaValidator rejects the requested limit
  "/data/postgres/v1/{addon_id}/reset":
    post:
      tags:
        - PG2.0
      summary: Reset the database.
      description: Delete all data in the database. This operation is synchronous and will return immediately upon completion. Optionally pass extensions to be installed after reset.
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extensions:
                  type: array
                  items:
                    type: string
                  description: Array of extension names to install
      responses:
        "200":
          description: Database reset successfully
        "403":
          description: Forbidden
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
        "422":
          description: Unprocessable Entity - Returned when reset validators reject the request (database not stable, plan upgrade in progress, invalid extension, etc.)
  "/data/postgres/v1/{addon_id}/upgrade/run":
    post:
      tags:
        - PG2.0
      summary: Run Postgres database version upgrade
      description: Runs a Postgres database upgrade to a target version. This operation is asynchronous and will return immediately. If the version is not provided, the default version will be used.
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  description: Target Postgres version to upgrade to (e.g., "17"). If not provided, the default version will be used.
      responses:
        "202":
          description: Upgrade request accepted and processing
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Confirmation message of the upgrade request
        "400":
          description: Bad Request - Returned when the request parameters are invalid or malformed
        "401":
          description: Unauthorized
        "422":
          description: Unprocessable Entity - Returned when validation fails (e.g., database not healthy, upgrade not allowed, invalid version, upgrade already in progress)
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
  "/data/postgres/v1/{addon_id}/diagnose":
    get:
      tags:
        - PG2.0
      summary: Get database diagnostic information
      description: Retrieves comprehensive diagnostic information about a PostgreSQL database including connection counts, long queries, transactions, indexes, bloat, hit rates, blocking queries, sequences, unlogged tables, and wraparound checks.
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Database diagnostic information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresDiagnosticReport'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
  "/data/postgres/v1/{addon_id}/expensive-queries":
    get:
      tags:
        - PG2.0
      summary: Get a list of expensive queries.
      description: Retrieves a list of the top 10 expensive queries with hourly observation data over the last week. Queries are sorted by total execution time descending. Query text is truncated to 4,000 chars. If no data is available, an empty array may be returned.
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A list of expensive queries
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExpensiveQueriesResponse"
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
  "/data/postgres/v1/{addon_id}/wait_status":
    get:
      tags:
        - PG2.0
      summary: Get database wait status
      description: Retrieves the wait status of a PostgreSQL database, indicating whether the database is currently waiting for provisioning or other operations to complete. When an active migration is in progress, this will return waiting=true with message="Migrating".
      parameters:
        - name: addon_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Database wait status
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WaitStatus"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Database not found

  /data/postgres/v1/{addon_id}/migrations:
    post:
      tags:
        - PG2.0
      summary: Create a new database migration
      description: Creates a migration in Shogun and automatically starts the preparation via DMS. This is used for migrating databases to Aurora Performance tier.
      parameters:
        - name: addon_id
          description: ID of target performance addon (Aurora cluster)
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_id
              properties:
                source_id:
                  type: string
                  format: uuid
                  description: Source addon UUID to migrate from
                method:
                  type: string
                  enum: ["cdc", "full-load", "assess-only"]
                  default: "full-load"
                  description: Migration method to use
                auto_promote:
                  type: boolean
                  default: false
                  description: Whether to automatically promote the target after migration completes
      responses:
        "201":
          description: Migration created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - PG2.0
      summary: Get migration status
      description: Returns the status of the migration including results from the pre-assessment
      parameters:
        - name: addon_id
          description: ID of target performance addon (Aurora cluster)
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Migration status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationResponse"
        "401":
          description: Unauthorized
        "404":
          description: Migration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /data/postgres/v1/{addon_id}/migrations/run:
    post:
      tags:
        - PG2.0
      summary: Run the migration
      description: Triggers the migration to copy the data and auto promote the target
      parameters:
        - name: addon_id
          description: ID of target performance addon (Aurora cluster)
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Migration run request accepted
        "401":
          description: Unauthorized
        "404":
          description: Migration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /data/postgres/v1/{addon_id}/migrations/cancel:
    post:
      tags:
        - PG2.0
      summary: Cancel the migration
      description: Stops the migration and deletes DMS objects. This takes time so creation of new migrations will be blocked until this completes.
      parameters:
        - name: addon_id
          description: ID of target performance addon (Aurora cluster)
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Migration cancellation request accepted
        "401":
          description: Unauthorized
        "404":
          description: Migration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /data/postgres/v1/{addon_id}/logical-replication/publishing/enable:
    post:
      tags:
        - PG2.0
      summary: Enable logical replication publishing
      description: |
        Starts asynchronous enablement of logical replication publishing for an operational,
        single-tenant Heroku Postgres Advanced database. Wait for the operation to complete
        before creating, updating, or deleting publications.
      parameters:
        - name: addon_id
          description: ID of the Heroku Postgres Advanced addon.
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          description: Heroku API authorization token.
          in: header
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Publishing enablement was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicalReplicationEnablementResponse"
        "401":
          description: Unauthorized
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The database is not eligible for logical replication publishing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /data/postgres/v1/{addon_id}/logical-replication/subscribing/enable:
    post:
      tags:
        - PG2.0
      summary: Enable logical replication subscribing
      description: |
        Starts asynchronous enablement of logical replication subscribing for an operational,
        single-tenant Heroku Postgres Advanced database.
      parameters:
        - name: addon_id
          description: ID of the Heroku Postgres Advanced addon.
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          description: Heroku API authorization token.
          in: header
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Subscribing enablement was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicalReplicationEnablementResponse"
        "401":
          description: Unauthorized
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The database is not eligible for logical replication subscribing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /data/postgres/v1/{addon_id}/logical-replication/publications:
    get:
      tags:
