                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialsResponse'
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
