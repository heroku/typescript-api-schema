      responses:
        '201':
          description: Credential created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsResponse'
        '401':
          description: Unauthorized
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                id: "not_found"
                message: "Database not found"
        '422':
          description: Unprocessable Entity - Returned when validators reject the credential (invalid name, reserved prefix, restricted role, etc.)
  /data/postgres/v1/{addon_id}/credentials/{cred_name}:
    get:
      tags:
        - PG2.0
      summary: Get database credential
      description: Retrieves a specific credential for a PostgreSQL database
      parameters:
        - name: addon_id
          description: ID of database addon
          in: path
          required: true
          schema:
            type: string
        - name: cred_name
