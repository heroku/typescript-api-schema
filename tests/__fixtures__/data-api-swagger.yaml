    # We can fill out more details about the app if necessary.
    App:
      description: The associated Heroku app for a database cluster.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
          description: "Unique identifier for the app"
        name:
          type: string
          example: "example"

    # We can fill out more details about the addon if necessary.
    Addon:
      description: The associated Heroku addon for a database cluster.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
          description: "Unique identifier for the addon"
        name:
          type: string
          example: "acme-inc-primary-database"

    PostgresTenant:
      description: A Heroku PostgreSQL Performance Tier database.
      type: object
      required:
        - app
        - addon
        - version
        - region
        - tier
        - status
        - created_at
        - forked_from
        - features
        - quotas
        - pools
        - metrics_sources
        - wait_status
      properties:
        app:
          $ref: '#/components/schemas/App'
        addon:
          $ref: '#/components/schemas/Addon'
        version:
          type: string
          example: "17.3"
        region:
          type: string
          enum:
            # Common Runtime Regions
            - us
            - eu
            # Private Spaces Regions
            - tokyo
            - mumbai
            - singapore
            - sydney
            - montreal
            - frankfurt
            - dublin
            - london
            - paris
            - virginia
            - ohio
            - california
            - oregon
          example: "us"
        tier:
          type: string
          enum: ["performance"]
        status:
          type: string
          enum: ["provisioning", "available", "modifying", "unavailable", "migrating"]
          example: "available"
          description: "Status of the database. 'migrating' indicates an active migration to this database is in progress."
        created_at:
          type: string
          format: date-time
          example: "2024-09-31T01:30:00.000-05:00"
        forked_from:
          type: object
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/Addon'
        features:
          type: object
          required:
            - continuous_protection
            - credentials
            - data_encryption
            - fork
            - highly_available
            - rollback
          properties:
            continuous_protection:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
            credentials:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                current_count:
                  type: integer
                  example: 10
            data_encryption:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
            fork:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
            highly_available:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
            rollback:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                earliest_time:
                  type: string
                  format: date-time
                  example: "2024-09-31T01:30:00.000-05:00"
                latest_time:
                  type: string
                  format: date-time
                  example: "2024-09-31T01:30:00.000-05:00"
        quotas:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/StorageQuota'
        plan_limits:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/TableLimit'
              - $ref: '#/components/schemas/StorageLimit'
          example:
            - name: "table-limit"
              current: 100
              limit: 4000
            - name: "storage-limit-in-gb"
              current: 0
              limit: 128000
        pools:
          type: array
          items:
            $ref: '#/components/schemas/ComputePool'
        metrics_sources:
          type: object
          description: "source identifiers to be used to look up metrics for this tenant at different levels"
          properties:
            cluster:
              type: string
              nullable: true
              format: uri
              description: "source identifier to look up cluster-level metrics, null if unavailable"
              example: "dod-rds-cluster://a1234567-89ab-cdef-0123-456789abcdef"
            database:
              type: string
              nullable: true
              format: uri
              description: "source identifier to look up database-level metrics, null if unavailable"
              example: "dod-aurora-postgres://b1234567-89ab-cdef-0123-456789abcdef"
            leader:
              type: string
              nullable: true
              format: uri
              description: "source identifier to look up leader instance-level metrics, null if unavailable"
              example: "dod-rds-instance://c1234567-89ab-cdef-0123-456789abcdef"
        wait_status:
          $ref: '#/components/schemas/WaitStatus'
          description: "Current wait status of the database"

    LogicalReplicationEnablementResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Started logical replication publishing enablement."

    LogicalReplicationPublicationTarget:
      description: |
        The database objects published through logical replication. A `tables` target
        includes exactly the specified tables. A `schemas` target includes existing and
        newly-created tables in its specified schemas. An `all_customer_schemas` target
        resolves to all currently eligible customer schemas when the publication is created;
        it requires Postgres 15 or later.
      oneOf:
        - $ref: "#/components/schemas/LogicalReplicationPublicationTablesTarget"
        - $ref: "#/components/schemas/LogicalReplicationPublicationSchemasTarget"
        - $ref: "#/components/schemas/LogicalReplicationPublicationAllCustomerSchemasTarget"

    LogicalReplicationPublicationTablesTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - tables
      properties:
        type:
          type: string
          enum: ["tables"]
        tables:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z_][a-z0-9_]*\\.[a-z_][a-z0-9_]*$"
          example: ["public.orders"]

    LogicalReplicationPublicationSchemasTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - schemas
      properties:
        type:
          type: string
          enum: ["schemas"]
        schemas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z_][a-z0-9_]*$"
          example: ["public"]

    LogicalReplicationPublicationAllCustomerSchemasTarget:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum: ["all_customer_schemas"]

    LogicalReplicationPublicationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - target
      properties:
        name:
          type: string
          pattern: "^[a-z_][a-z0-9_]{0,62}$"
          example: "orders"
        target:
          $ref: "#/components/schemas/LogicalReplicationPublicationTarget"

    LogicalReplicationPublicationUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - target
      properties:
        target:
          $ref: "#/components/schemas/LogicalReplicationPublicationTarget"

    LogicalReplicationPublication:
      type: object
      required:
        - name
        - owner
        - target
        - current_tables
      properties:
        name:
          type: string
          example: "orders"
        owner:
          type: string
          description: Database role that owns the publication.
          example: "u12345"
        target:
          oneOf:
            - $ref: "#/components/schemas/LogicalReplicationPublicationTablesResponseTarget"
            - $ref: "#/components/schemas/LogicalReplicationPublicationSchemasResponseTarget"
        current_tables:
          description: Fully-qualified tables currently included in the publication.
          type: array
          items:
            type: string
          example: ["public.orders"]

    LogicalReplicationPublicationTablesResponseTarget:
      type: object
      required:
        - type
        - tables
        - automatically_includes_new_tables
        - automatically_includes_new_schemas
      properties:
        type:
          type: string
          enum: ["tables"]
        tables:
          type: array
          items:
            type: string
          example: ["public.orders"]
        automatically_includes_new_tables:
          type: boolean
          example: false
        automatically_includes_new_schemas:
          type: boolean
          example: false

    LogicalReplicationPublicationSchemasResponseTarget:
      type: object
      required:
        - type
        - schemas
        - automatically_includes_new_tables
        - automatically_includes_new_schemas
      properties:
        type:
          type: string
          enum: ["schemas"]
        schemas:
          type: array
          items:
            type: string
          example: ["public"]
        automatically_includes_new_tables:
          type: boolean
          example: true
        automatically_includes_new_schemas:
          type: boolean
          example: false

    LogicalReplicationPublicationsResponse:
      type: object
      required:
        - items
        - count
        - limit
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogicalReplicationPublication"
        count:
          type: integer
          minimum: 0
          description: Number of publications returned in `items`.
          example: 1
        limit:
          type: integer
          minimum: 1
          description: Maximum number of publications returned by the collection endpoint.
          example: 50

    WaitStatus:
      description: Represents the wait status of a PostgreSQL database, indicating whether the database is currently waiting for provisioning or other operations to complete. When an active migration is in progress, this will return waiting=true with message="Migrating".
      type: object
      required:
        - waiting
        - message
      properties:
        waiting:
          type: boolean
          description: "Whether the database has an operation to wait for"
          example: true
        message:
          type: string
          nullable: true
          description: "Human-readable message describing the current wait status. Can be 'Provisioning', 'Migrating', 'Updating', or other status messages."
          example: "Provisioning"
      example:
        waiting: true
        message: "Provisioning"

    ComputeInstance:
      description: Represents a unit of compute for a database cluster.
      type: object
      properties:
        id:
          type: string
          format: string
          example: "i3r507gt6dbscn"
        name:
          type: string
          example: "i3r507gt6dbscn"
        level:
          type: string
          example: "16G-Performance"
        role:
          type: string
          example: "writer"
        status:
          type: string
          example: "available"
        updated_at:
          type: string
          format: date-time
          example: "2024-09-31T01:30:00.000-05:00"
        metrics_source:
          type: string
          format: uri
          description: "source identifier to look up instance-level metrics"
          example: "dod-rds-instance://f1234567-89ab-cdef-0123-456789abcdef"

    ConnectionEndpoint:
      description: Represents a means of connecting to a database pool.
      type: object
      required:
        - host
        - port
        - status
      properties:
        host:
          type: string
          example: "c1n66rbai40pl3.cluster-czrs8kj4isg7.us-east-1.rds.amazonaws.com"
        port:
          type: integer
          example: 5432
        status:
          type: string
          enum: ["available", "modifying", "degraded", "deprovisioning"]
          example: "modifying"

    ComputePool:
      description: |
        A collection of compute instances that are part of a database cluster and
        behind similar connection endpoints.
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
          description: "Unique identifier for the compute pool"
        name:
          type: string
          example: "analytics"
        expected_level:
          type: string
          description: The expected level of all instances in the pool. All instances should eventually reach this expected level.
          example: "32G-Performance"
        expected_count:
          type: integer
          description: The expected count of instances in the pool. The pool should eventually reach this expected count of instances.
          example: 1
        expected_connection_limit:
          type: integer
          description: The expected connection limit for the pool given the expected_count and expected_level
          example: 5000
        connections_used:
          type: integer
          description: The count of currently used connections
          example: 100
          nullable: true
        status:
          type: string
          enum: ["provisioning", "available", "modifying", "unknown"]
          example: "modifying"
        # TODO: Could an instance pool have multiple endpoints?
        # Such as for pgbouncer, mtls, private-link, etc.
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionEndpoint'
        compute_instances:
          type: array
          items:
            $ref: '#/components/schemas/ComputeInstance'
      required:
        - name
        - expected_level
        - expected_count
        - expected_connection_limit
        - connections_used
        - compute_instances

    PostgresDiagnostic:
      type: object
      required:
        - name
        - summary
        - status
        - results
      properties:
        name:
          type: string
          description: Field name of the check
        summary:
          type: string
          description: Human-readable summary of the check
        status:
          type: string
          enum: ["skipped", "green", "yellow", "red"]
          description: Status of the check
          example: "green"
        results:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Check-specific results
      example:
        name: "connection_count"
        summary: "Connection Count"
        status: "green"
        results:
          - count: 100

    PostgresDiagnosticReport:
      type: object
      required:
        - created_at
        - items
      properties:
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostgresDiagnostic'
      example:
        created_at: "2024-09-31T01:30:00.000-05:00"
        items:
          - name: "connection_count"
            summary: "Connection Count"
            status: "green"
            results:
              - count: 100

          - name: "long_queries"
            summary: "Long Queries"
            status: "green"
            results:
              - pid: 12345
                duration: 100
                query: "SELECT * FROM public.jobs"

              - pid: 12346
                duration: 100
                query: "SELECT * FROM public.logs"

          - name: "long_transactions"
            summary: "Long Transactions"
            status: "green"
            results:
              - pid: 12345
                duration: 100
                state: "active"
                query: "SELECT * FROM public.jobs"

              - pid: 12346
                duration: 100
                state: "active"
                query: "SELECT * FROM public.logs"

          - name: "idle_in_transaction"
            summary: "Idle in Transaction"
            status: "green"
            results:
              - pid: 12345
                duration: 100
                query: "SELECT * FROM public.jobs"
              - pid: 12346
                duration: 100
                query: "SELECT * FROM public.logs"

          - name: "indexes"
            status: "yellow"
            results:
              - reason: "Never Used Indexes"
                index: "idx_users_email"
                index_scan_pct: 100
                scans_per_write: 100
                index_size: 10 GB
                table_size: 100 GB

          - name: "bloat"
            summary: "Bloat"
            status: "green"
            results:
              - type: "index"
                object: "public.jobs::id_idx"
                bloat: 100
                waste: 100

          - name: "hit_rate"
            summary: "Hit Rate"
            status: "green"
            results:
              - name: public.jobs
                percentage: 98.407
              - name: public.logs
                percentage: 96.340

          - name: "blocking_queries"
            summary: "Blocking Queries"
            status: "green"
            results:
              - blocked_pid: 12345
                blocking_statement: "SELECT * FROM public.jobs"
                blocking_duration: 100
                blocking_pid: 12346
                blocked_statement: "SELECT * FROM public.logs"
                blocked_duration: 100

          - name: "int4_sequence_usage"
            summary: "Int4 Sequence Usage"
            status: "green"
            results:
              - col: public.jobs(id)
                seq: public.jobs_id_seq
              - col: public.logs(id)
                seq: public.logs_id_seq

          - name: "unlogged_tables"
            summary: "Unlogged Tables"
            status: "green"
            results:
              - schema: "public"
                table: "users"
                owner: "uafndf8hhid2kh"
              - schema: "public"
                table: "logs"
                owner: "uafndf8hhid2kh"

          - name: "table_transaction_id_wraparound"
            summary: "Table Transaction ID Wraparound"
            status: "green"
            results:
              - schema: "public"
                table: "users"
                percentage: 50

          - name: "database_transaction_id_wraparound"
            summary: "Database Transaction ID Wraparound"
            status: "green"
            results:
              - name: databasename
                percentage: 50

          - name: "schema_check"
            summary: "Schema Check"
            status: "green"
            results:
              - count: 4

